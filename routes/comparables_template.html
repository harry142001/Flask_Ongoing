<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Comparable Properties — CurbsideRE</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --black:#0a0a0a; --white:#ffffff; --off:#f8f7f4; --border:#e8e4dc;
  --muted:#9b9488; --accent:#1a3a4a; --gold:#b8892a; --green:#2d6a4f; --red:#b5312a;
}
body { font-family:'Inter',sans-serif; background:var(--off); color:var(--black); min-height:100vh; }
.topbar { background:var(--accent); padding:0.6rem 2rem; display:flex; align-items:center; gap:1rem; }
.topbar-brand { font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.2em; text-transform:uppercase; color:rgba(255,255,255,0.5); }
.topbar-sep { color:rgba(255,255,255,0.2); }
.topbar-page { font-size:0.75rem; color:rgba(255,255,255,0.8); font-weight:500; }
.hero { background:var(--black); color:var(--white); padding:3rem 2.5rem 2.5rem; position:relative; overflow:hidden; }
.hero::before { content:''; position:absolute; top:-60px; right:-60px; width:300px; height:300px; border-radius:50%; background:radial-gradient(circle,rgba(184,137,42,0.15) 0%,transparent 70%); pointer-events:none; }
.hero-label { font-family:'JetBrains Mono',monospace; font-size:0.65rem; letter-spacing:0.25em; text-transform:uppercase; color:var(--gold); margin-bottom:0.75rem; }
.hero-address { font-family:'Playfair Display',serif; font-size:clamp(1.6rem,4vw,2.8rem); line-height:1.15; font-weight:700; margin-bottom:0.5rem; }
.hero-sub { font-size:0.9rem; color:rgba(255,255,255,0.5); font-weight:300; margin-bottom:2rem; }
.hero-stats { display:flex; gap:2.5rem; flex-wrap:wrap; }
.hero-stat { display:flex; flex-direction:column; gap:0.2rem; }
.hero-stat-label { font-family:'JetBrains Mono',monospace; font-size:0.6rem; letter-spacing:0.15em; text-transform:uppercase; color:rgba(255,255,255,0.35); }
.hero-stat-value { font-size:1.1rem; font-weight:600; color:var(--white); }
.hero-stat-value.gold { color:var(--gold); }
.search-wrap { background:#fff; border-bottom:1px solid var(--border); padding:1rem 2.5rem; display:flex; gap:0.75rem; align-items:center; flex-wrap:wrap; }
.search-wrap input[type=text] { flex:1; min-width:200px; font-family:'Inter',sans-serif; font-size:0.875rem; padding:0.6rem 1rem; border:1.5px solid var(--border); border-radius:6px; outline:none; color:var(--black); background:var(--off); transition:border-color 0.15s,background 0.15s; }
.search-wrap input[type=text]:focus { border-color:var(--accent); background:#fff; }
.radius-wrap { display:flex; align-items:center; gap:0.5rem; white-space:nowrap; }
.radius-wrap label { font-family:'JetBrains Mono',monospace; font-size:0.65rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }
.radius-wrap input[type=number] { width:70px; font-family:'JetBrains Mono',monospace; font-size:0.82rem; padding:0.6rem 0.6rem; border:1.5px solid var(--border); border-radius:6px; outline:none; color:var(--accent); background:var(--off); text-align:center; transition:border-color 0.15s; }
.radius-wrap input[type=number]:focus { border-color:var(--accent); background:#fff; }
.radius-wrap span { font-size:0.75rem; color:var(--muted); }
.search-wrap button { font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; padding:0.6rem 1.5rem; background:var(--accent); color:#fff; border:none; border-radius:6px; cursor:pointer; transition:opacity 0.15s; white-space:nowrap; }
.search-wrap button:hover { opacity:0.85; }
main { max-width:1200px; margin:0 auto; padding:2.5rem 2.5rem 5rem; }
.section-header { display:flex; align-items:baseline; gap:1rem; margin-bottom:1.5rem; }
.section-title { font-family:'Playfair Display',serif; font-size:1.3rem; font-weight:400; }
.section-count { font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.1em; color:var(--muted); text-transform:uppercase; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:1.25rem; margin-bottom:3rem; }
.card { background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; transition:box-shadow 0.2s,transform 0.2s; position:relative; }
.card:hover { box-shadow:0 8px 32px rgba(0,0,0,0.1); transform:translateY(-2px); }
.card-rank { position:absolute; top:1rem; left:1rem; width:28px; height:28px; background:var(--black); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:0.7rem; font-weight:500; z-index:2; }
.card-rank.nearest { background:var(--green); }
.card-top { background:linear-gradient(135deg,#1a3a4a 0%,#0d2233 100%); padding:1.5rem 1.25rem 1.25rem 3rem; }
.card-address { font-weight:600; font-size:0.95rem; color:#fff; line-height:1.3; margin-bottom:0.3rem; }
.card-city { font-size:0.78rem; color:rgba(255,255,255,0.5); font-weight:300; }
.card-body { padding:1.25rem; }
.card-price { font-family:'Playfair Display',serif; font-size:1.5rem; color:var(--black); font-weight:700; margin-bottom:1rem; line-height:1; }
.card-meta { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin-bottom:1rem; }
.meta-item { display:flex; flex-direction:column; gap:0.15rem; }
.meta-label { font-family:'JetBrains Mono',monospace; font-size:0.58rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); }
.meta-value { font-size:0.82rem; font-weight:500; color:var(--black); }
.card-footer { border-top:1px solid var(--border); padding:0.75rem 1.25rem; display:flex; align-items:center; justify-content:space-between; background:var(--off); }
.dist-badge { display:flex; align-items:center; gap:0.4rem; font-family:'JetBrains Mono',monospace; font-size:0.68rem; color:var(--muted); }
.dist-dot { width:6px; height:6px; border-radius:50%; background:var(--green); }
.dist-dot.far { background:var(--gold); }
.dist-dot.farther { background:var(--red); }
.broker-tag { font-size:0.72rem; color:var(--muted); max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.table-section { background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.table-header { padding:1.25rem 1.5rem; border-bottom:1px solid var(--border); }
.table-title { font-family:'Playfair Display',serif; font-size:1rem; font-weight:400; }
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:0.82rem; }
thead th { font-family:'JetBrains Mono',monospace; font-size:0.6rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); text-align:left; padding:0.75rem 1.25rem; border-bottom:1px solid var(--border); white-space:nowrap; background:var(--off); }
tbody tr { border-bottom:1px solid var(--border); transition:background 0.1s; }
tbody tr:last-child { border-bottom:none; }
tbody tr:hover { background:var(--off); }
tbody td { padding:0.85rem 1.25rem; }
td.td-rank { font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--muted); }
td.td-addr { font-weight:500; }
td.td-city { color:var(--muted); font-size:0.78rem; }
td.td-price { font-family:'JetBrains Mono',monospace; font-weight:500; color:var(--accent); white-space:nowrap; }
td.td-dist { font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:var(--muted); }
td.td-agent { font-size:0.78rem; color:var(--muted); }
.empty-state { text-align:center; padding:5rem 2rem; color:var(--muted); }
.empty-icon { font-size:2.5rem; margin-bottom:1rem; }
.empty-title { font-family:'Playfair Display',serif; font-size:1.2rem; margin-bottom:0.5rem; color:var(--black); }
#error-box { display:none; background:#fdf1f0; border:1px solid #f5c6c4; color:var(--red); padding:1rem 1.5rem; border-radius:8px; font-size:0.875rem; margin-bottom:1.5rem; }
@media(max-width:600px) { .hero{padding:2rem 1.25rem} main{padding:1.5rem 1.25rem 4rem} .search-wrap{padding:0.75rem 1.25rem} .cards{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="topbar">
  <span class="topbar-brand">CurbsideRE</span>
  <span class="topbar-sep">›</span>
  <span class="topbar-page">Comparable Properties</span>
</div>
<div class="hero">
  <div class="hero-label">Subject Property</div>
  <div class="hero-address" id="h-address">—</div>
  <div class="hero-sub" id="h-location"></div>
  <div class="hero-stats">
    <div class="hero-stat"><div class="hero-stat-label">List Price</div><div class="hero-stat-value gold" id="h-price">—</div></div>
    <div class="hero-stat"><div class="hero-stat-label">Postal Code</div><div class="hero-stat-value" id="h-postal">—</div></div>
    <div class="hero-stat"><div class="hero-stat-label">Comparables Found</div><div class="hero-stat-value" id="h-count">—</div></div>
    <div class="hero-stat"><div class="hero-stat-label">Search Radius</div><div class="hero-stat-value" id="h-radius">—</div></div>
    <div class="hero-stat"><div class="hero-stat-label">Avg Comp Price</div><div class="hero-stat-value" id="h-avg">—</div></div>
  </div>
</div>
<div class="search-wrap">
  <div style="flex:1;position:relative;min-width:200px">
    <input type="text" id="addr-input" placeholder="Type any address or city…" value="__ADDRESS__" autocomplete="off" oninput="suggest(this.value)"/>
    <div id="suggestions" style="display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid #1a3a4a;border-top:none;border-radius:0 0 6px 6px;z-index:100;max-height:280px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,0.12)"></div>
  </div>
  <div class="radius-wrap">
    <label for="radius-input">Radius</label>
    <input type="number" id="radius-input" value="1.5" min="0.5" max="10" step="0.5"/>
    <span>km</span>
  </div>
  <button onclick="load()">Search</button>
</div>
<main>
  <div id="error-box"></div>
  <div class="section-header">
    <div class="section-title">Nearby Comparables</div>
    <div class="section-count" id="card-count"></div>
  </div>
  <div class="cards" id="cards-grid">
    <div style="grid-column:1/-1">
      <div class="empty-state">
        <div class="empty-icon">🏘</div>
        <div class="empty-title">Type an address above to find comparables</div>
      </div>
    </div>
  </div>
  <div class="table-section">
    <div class="table-header"><div class="table-title">Full Comparables Table</div></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Address</th><th>City</th><th>Price</th><th>Distance</th><th>Agent</th><th>Broker</th></tr></thead>
        <tbody id="comp-table"><tr><td colspan="7" style="text-align:center;padding:2rem;color:#9b9488;font-style:italic">No data loaded</td></tr></tbody>
      </table>
    </div>
  </div>
</main>
<script>
let suggestTimer = null;
function fmt(n){if(!n&&n!==0)return'—';return'$'+Math.round(n).toLocaleString('en-CA')}
function parsePrice(s){if(!s)return null;const n=parseFloat(String(s).replace(/[$,\s]/g,''));return isNaN(n)?null:n}
function distColor(km){if(km<0.5)return'nearest';if(km<1.0)return'far';return'farther'}

function suggest(val){
  clearTimeout(suggestTimer);
  const box=document.getElementById('suggestions');
  if(val.length<2){box.style.display='none';return}
  suggestTimer=setTimeout(async()=>{
    const res=await fetch(`/api/v1/suggest?q=${encodeURIComponent(val)}`);
    const items=await res.json();
    if(!items.length){box.style.display='none';return}
    box.innerHTML=items.map(item=>`
      <div onclick="selectAddress('${item.address.replace(/'/g,"\\'")}')"
           style="padding:0.75rem 1rem;cursor:pointer;border-bottom:1px solid #f0ede8;display:flex;justify-content:space-between;align-items:center;font-size:0.85rem"
           onmouseover="this.style.background='#f8f7f4'" onmouseout="this.style.background='#fff'">
        <div>
          <div style="font-weight:500;color:#0a0a0a">${item.address}</div>
          <div style="font-size:0.75rem;color:#9b9488">${item.city} · ${item.postal}</div>
        </div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:0.78rem;color:#1a3a4a;font-weight:500">${item.price?item.price.trim():''}</div>
      </div>`).join('');
    box.style.display='block';
  },200);
}

function selectAddress(addr){
  document.getElementById('addr-input').value=addr;
  document.getElementById('suggestions').style.display='none';
  load();
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.search-wrap')) document.getElementById('suggestions').style.display='none';
});

async function load(){
  const addr=document.getElementById('addr-input').value.trim();
  const radius=parseFloat(document.getElementById('radius-input').value)||1.5;
  if(!addr)return;
  document.getElementById('suggestions').style.display='none';
  const errBox=document.getElementById('error-box');
  errBox.style.display='none';
  try{
    const res=await fetch(`/api/v1/comparables?address=${encodeURIComponent(addr)}&radius_km=${radius}`);
    if(!res.ok){const j=await res.json();errBox.textContent=j.error||'Property not found.';errBox.style.display='block';return}
    render(await res.json());
  }catch(e){errBox.textContent='Could not connect to server.';errBox.style.display='block'}
}

function render(data){
  const s=data.subject||{};const comps=data.comparables||[];
  document.getElementById('h-address').textContent=s.address||'—';
  document.getElementById('h-location').textContent=[s.city,s.province].filter(Boolean).join(', ');
  document.getElementById('h-price').textContent=s.price?s.price.trim():'—';
  document.getElementById('h-postal').textContent=s.postal||'—';
  document.getElementById('h-count').textContent=comps.length;
  document.getElementById('h-radius').textContent=data.radius_km+' km';
  const prices=comps.map(c=>parsePrice(c.compsaleamount)).filter(Boolean);
  const avg=prices.length?prices.reduce((a,b)=>a+b,0)/prices.length:null;
  document.getElementById('h-avg').textContent=avg?fmt(avg):'—';
  document.getElementById('card-count').textContent=comps.length?`${comps.length} properties found`:'';
  const grid=document.getElementById('cards-grid');
  if(!comps.length){
    grid.innerHTML=`<div style="grid-column:1/-1"><div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No comparables found</div></div></div>`;
    document.getElementById('comp-table').innerHTML='<tr><td colspan="7" style="text-align:center;padding:2rem;color:#9b9488;font-style:italic">No comparables found</td></tr>';
    return;
  }
  grid.innerHTML=comps.map((c,i)=>{
    const price=parsePrice(c.compsaleamount);const subPrice=parsePrice(s.price);
    let diff='';
    if(price&&subPrice){const pct=((price-subPrice)/subPrice*100).toFixed(1);const sign=pct>0?'+':'';diff=`<span style="color:${pct>=0?'var(--green)':'var(--red)'};font-size:0.75rem;font-weight:500;margin-left:0.4rem">${sign}${pct}%</span>`}
    return`<div class="card">
      <div class="card-rank ${i===0?'nearest':''}">${i+1}</div>
      <div class="card-top">
        <div class="card-address">${c.property_location||'—'}</div>
        <div class="card-city">${c.city||''} ${c.postal_code?'· '+c.postal_code:''}</div>
      </div>
      <div class="card-body">
        <div class="card-price">${price?fmt(price):'—'}${diff}</div>
        <div class="card-meta">
          <div class="meta-item"><div class="meta-label">Distance</div><div class="meta-value">${c.distance_km} km away</div></div>
          <div class="meta-item"><div class="meta-label">Postal Code</div><div class="meta-value">${c.postal_code||'—'}</div></div>
          <div class="meta-item"><div class="meta-label">Agent</div><div class="meta-value" style="font-size:0.78rem">${c.agent||'—'}</div></div>
          <div class="meta-item"><div class="meta-label">Broker</div><div class="meta-value" style="font-size:0.78rem">${c.broker||'—'}</div></div>
        </div>
      </div>
      <div class="card-footer">
        <div class="dist-badge"><div class="dist-dot ${distColor(c.distance_km)}"></div>${c.distance_km<0.5?'Very close':c.distance_km<1.0?'Nearby':'Within radius'}</div>
        <div class="broker-tag" title="${c.broker||''}">${c.broker||'—'}</div>
      </div>
    </div>`
  }).join('');
  document.getElementById('comp-table').innerHTML=comps.map((c,i)=>`
    <tr>
      <td class="td-rank">${i+1}</td>
      <td class="td-addr">${c.property_location||'—'}</td>
      <td class="td-city">${c.city||'—'}</td>
      <td class="td-price">${c.compsaleamount?c.compsaleamount.trim():'—'}</td>
      <td class="td-dist">${c.distance_km} km</td>
      <td class="td-agent">${c.agent||'—'}</td>
      <td class="td-agent">${c.broker||'—'}</td>
    </tr>`).join('');
}

window.addEventListener('DOMContentLoaded',()=>{
  const val=document.getElementById('addr-input').value.trim();
  if(val)load();
  document.getElementById('addr-input').addEventListener('keydown',e=>{if(e.key==='Enter')load()});
});
</script>
</body>
</html>
